name: Release

# Push a tag such as v0.4.0 (matching package.json) to publish a prebuilt package.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - run: npm ci
      - name: Pack
        run: |
          npm pack
          # A fixed asset name keeps releases/latest/download/hdu-cli.tgz stable for installers.
          cp "hdu-cli-${GITHUB_REF_NAME#v}.tgz" hdu-cli.tgz
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" hdu-cli.tgz "hdu-cli-${GITHUB_REF_NAME#v}.tgz" \
            --title "hdu-cli ${GITHUB_REF_NAME}" --generate-notes
